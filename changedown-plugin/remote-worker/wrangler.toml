name = "changedown-remote-relay"
main = "src/index.ts"
compatibility_date = "2026-05-06"

[observability]
enabled = false

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[env.staging]
name = "changedown-remote-relay-staging"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[env.staging.vars]
PANE_ALLOWED_ORIGINS = "https://127.0.0.1:3000,https://changedown.com"
API_ALLOWED_ORIGINS = "https://127.0.0.1:3000,https://changedown.com,https://changedown-remote-relay-staging.hackerbara.workers.dev"
